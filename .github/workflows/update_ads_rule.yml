name: AUTO Update Ads Rule
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: Auto-Update-Ads-Rule
  cancel-in-progress: true
jobs:
  build-ads-rules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 安装 Mihomo
      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          echo "获取 Mihomo 最新版本..."
          RELEASE_JSON="$(
            curl -fsSL --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          )"
          MIHOMO_VERSION="$(
            printf '%s' "$RELEASE_JSON" |
              python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          tag = data.get("tag_name")
          if not tag:
              raise SystemExit("GitHub API 返回中没有 tag_name")
          print(tag)
          '
          )"
          MIHOMO_ASSET="$(
            printf '%s' "$RELEASE_JSON" |
              python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          candidates = []
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              if (
                  name.startswith("mihomo-linux-amd64-")
                  and name.endswith(".gz")
              ):
                  candidates.append(name)
          if not candidates:
              raise SystemExit("找不到 mihomo-linux-amd64-*.gz，请检查 Mihomo 最新 Release 的资产名称。")
          print(candidates[0])
          '
          )"
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_ASSET}"
          echo "========================================"
          echo "Mihomo 最新版本：${MIHOMO_VERSION}"
          echo "下载文件：${MIHOMO_ASSET}"
          echo "下载地址：${DOWNLOAD_URL}"
          echo "========================================"
          echo "下载 Mihomo..."
          curl -fL --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -o /tmp/mihomo.gz \
            "$DOWNLOAD_URL"
          echo "检查下载文件..."
          test -s /tmp/mihomo.gz
          echo "校验 gzip..."
          gzip -t /tmp/mihomo.gz
          echo "解压 Mihomo..."
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod 755 /tmp/mihomo
          echo "检查 Mihomo 文件类型..."
          file /tmp/mihomo
          echo "检查 Mihomo 是否可以运行..."
          /tmp/mihomo -v || true
          echo "Mihomo 安装完成：${MIHOMO_VERSION}"

      # 下载3个广告源、提取域名、合并、全局去重排序 → rule/Ads.list
      - name: Download & Merge Ads Domain Rules
        shell: bash
        env:
          ADS_SOURCE_URLS: |
            https://github.com/666OS/rules/raw/release/mihomo/domain/Tracking.txt
            https://github.com/TG-Twilight/AWAvenue-Ads-Rule/raw/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
            https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ads-all.list
          OUT_ADS_LIST: rule/Ads.list
        run: |
          set -euo pipefail
          mkdir -p rule
          TMP_DIR="/tmp/rules_tmp"
          mkdir -p "$TMP_DIR"

          echo "===== 开始下载并合并【Ads广告域名规则源】 ====="
          ADS_FILES="$TMP_DIR/ads_files.txt"
          : > "$ADS_FILES"
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            filename="${url##*/}"
            filename="${filename%%\?*}"
            filename="${filename%%#*}"
            dl_path="$TMP_DIR/$filename"
            echo "下载Ads源: $filename"
            curl -fsSL --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              -o "$dl_path" "$url"
            printf '%s\n' "$dl_path" >> "$ADS_FILES"
          done <<< "$ADS_SOURCE_URLS"

          python3 - <<'PY'
          import yaml
          from pathlib import Path
          domain_set = set()
          file_list = Path("/tmp/rules_tmp/ads_files.txt").read_text(encoding="utf-8").splitlines()
          for fpath in file_list:
              if not fpath.strip():
                  continue
              raw = Path(fpath).read_text(encoding="utf-8", errors="ignore")
              # 支持 .list / .txt 纯域名列表 和 clash .yaml payload
              if fpath.endswith(".list") or fpath.endswith(".txt"):
                  for line in raw.splitlines():
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      domain_set.add(line)
              else:
                  data = yaml.safe_load(raw)
                  if isinstance(data, dict) and "payload" in data:
                      for item in data["payload"]:
                          if isinstance(item, str):
                              item = item.strip()
                              if not item or item.startswith("#"):
                                  continue
                              domain_set.add(item)
          out_path = Path("rule/Ads.list")
          with open(out_path, "w", encoding="utf-8", newline="\n") as f:
              for d in sorted(domain_set):
                  f.write(f"{d}\n")
          print(f"Ads广告域名合并完成，共 {len(domain_set)} 条")
          PY
          test -s "${OUT_ADS_LIST}"

      # Ads.list 转换 Ads.mrs
      - name: Convert Ads LIST to MRS
        shell: bash
        run: |
          set -euo pipefail
          ADS_LIST="rule/Ads.list"
          ADS_MRS="rule/Ads.mrs"
          echo "===== 转换 Ads.list → ${ADS_MRS} ====="
          timeout 180s /tmp/mihomo convert-ruleset domain text "${ADS_LIST}" "${ADS_MRS}" > /tmp/convert_ads.log 2>&1
          cat /tmp/convert_ads.log
          test -s "${ADS_MRS}"
          echo "Ads广告域名MRS生成成功"

      # SHA256对比，仅Ads两个文件变更时提交
      - name: SHA256 Compare and Commit Ads Rule
        shell: bash
        env:
          COMMIT_MSG: AUTO Update Ads Rule
        run: |
          set -euo pipefail
          FILE_LIST=(
            rule/Ads.list
            rule/Ads.mrs
          )
          declare -A new_sha
          declare -A old_sha
          any_change=0
          for f in "${FILE_LIST[@]}"; do
            new_sha[$f]=$(sha256sum "$f" | awk '{print $1}')
            old_sha[$f]="MISSING"
            if git cat-file -e "HEAD:${f}" 2>/dev/null; then
              old_sha[$f]=$(git show "HEAD:${f}" | sha256sum | awk '{print $1}')
            fi
            echo "File: $f"
            echo "  New SHA: ${new_sha[$f]}"
            echo "  Old SHA: ${old_sha[$f]}"
            if [[ "${new_sha[$f]}" != "${old_sha[$f]}" ]]; then
              any_change=1
            fi
          done
          if [[ "$any_change" -eq 0 ]]; then
            echo "Ads规则SHA256无变化，无需提交，退出"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILE_LIST[@]}"
          if git diff --cached --quiet; then
            echo "Git暂存区无实际改动，跳过提交"
            exit 0
          fi
          git commit -m "${COMMIT_MSG}"
          git push
