# Name: Mihomo Yaml Config - GEO Data & Standard Edition
# Link: https://github.com/gogyt/Mihomo/blob/main/yaml/Geo.yaml

# 功能描述
# ──────────────────────────────────────────────────────────
#  规则来源：       ✅ 内置GEO   ☐ RULE-SET规则集      
# ──────────────────────────────────────────────────────────
#  分流程度：       ✅ 标准分流  ☐ 精简分流  ☐ 重度分流
# ──────────────────────────────────────────────────────────
#  仅内核运行：     ✅ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  广告拦截：       ✅ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  自定义故障转移:  ✅ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  多元故障转移：   ☐ 支持      ✅ 不支持            
# ──────────────────────────────────────────────────────────
#  多机场出站类型： ✅ 混合出站  ☐ 指定机场出站  ✅ 指定节点出站
# ──────────────────────────────────────────────────────────

# 配置说明
# 1) 本配置最多采用五层策略,略有套娃,但层次功能分明,可实现长时免维护稳定运行；
# 2) 自定义故障转移，是指故障转移策略组优先“全球手动”的策略组或节点，当“全球手动”节点不可用时自动切换下一策略组节点，策略层级逻辑：故障转移 → 全球手动 → 地区策略 → 均衡or散列or自动or手动 → 该地区某节点,例如：故障转移 → 全球手动 → 日本策略 → 日本自动(所有机场节点) → 某具体的日本节点(所有机场当中ping最低的日本节点),当"全球手动"节点失联时,自动切换至下一策略组“狮城策略”，依此类推；
# 3) 需要全防泄漏,使用时将分流策略的"漏网之鱼"、“网络测试”和“默认直连”选择为任意代理节点即可(实际意义并不大)。
# 4) 关于"默认直连"策略组,主要挂载了geolocation-!cn非中国域名,它包含了gfw被墙域名,以及其他几乎未被墙的境外域名,含有如cloudflare、cloudfront、fastly等CDN站点，由于先滤掉了gfw被墙域名，剩下的几乎未被墙，可根据使用情况切换代理。
# 5) 如果你不熟悉配置，仅将你的机场链接填入“1.2机场配置”的url即可使用。如果需个性化配置，配置前仔细阅读配置中的相关说明,根据需要自行调整。

# 配置区

# 1 订阅配置 
# 1.1 订阅基本配置（根据自己机场特性,在filter参数中添加不需要的机场节点关键字,若需保留相关节点,删除该节点名称的关键字）
ProxyAnchor:  &ProxyAnchor {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, filter: '^(?!.*(客户端|特殊|如果|导致|失效|重新|一下|测试|剩余|套餐|公告|排除|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic))'}

# 1.2 机场配置 
# 填入机场订阅链接,可自定义机场名称。末尾的[主][备]为每个节点添加机场名称前缀,可自定义,避免不同的机场节点重名导致出错。
proxy-providers:
  # Airport1订阅源 - 主机场节点集合
  Airport1: {<<: *ProxyAnchor, url: 'Airport1订阅源地址', override: {additional-prefix: '[主] '}}
  # Airport2订阅源 - 备用机场节点集合
#  Airport2: {<<: *ProxyAnchor, url: 'Airport2订阅源地址', override: {additional-prefix: '[备] '}}

# 2 锚点配置 
# 2.1策略组类型锚点 - 定义不同的策略组基础配置
StrategyHS:   &StrategyHS {type: select}
StrategyFB:   &StrategyFB {type: fallback,     empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204'}
StrategyCR:   &StrategyCR {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', strategy: round-robin}         # 轮询：新建立一条 TCP 连接，就依次轮换选取下一个可用节点，循环往复，连接均匀分摊到全部存活节点，不会根据延迟选节点，它只负责流量分发，健康检查仅用于剔除故障节点，不做优先级排序；
StrategyCH:   &StrategyCH {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', strategy: consistent-hashing}  # 一致性哈希（散列）：提取访问目标的顶级域名做哈希计算，哈希值映射到固定节点，同一个域名永远走同一个节点；
StrategySS:   &StrategySS {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', strategy: sticky-sessions}     # 粘性会话（粘滞）：使用「源 IP + 目标地址」组合作为 key 做哈希缓存，缓存有效期约 10 分钟；在缓存有效期内，同一客户端访问同一目标，固定分配同一个节点；超时后重新哈希分配。
StrategyUT:   &StrategyUT {type: url-test,     empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50}

# 2.2 规则集行为锚点
BehaviorDN:   &BehaviorDN {type: http, behavior: domain,    format: mrs,  interval: 86400}
BehaviorDY:   &BehaviorDY {type: http, behavior: domain,    format: yaml, interval: 86400}
BehaviorIP:   &BehaviorIP {type: http, behavior: ipcidr,    format: mrs,  interval: 86400}
BehaviorCY:   &BehaviorCY {type: http, behavior: classical, format: yaml, interval: 86400}
BehaviorTT:   &BehaviorTT {type: http, behavior: domain,    format: text, interval: 86400}

# 2.3 机场节点筛选正则表达式 - 基于地理位置和关键词过滤
FilterHK:     &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$'
FilterSG:     &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$'
FilterJP:     &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK)).*$'
FilterKR:     &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South)).*$'
FilterUS:     &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|JFK|SJC|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(Plus|Australia)).*$'
FilterTW:     &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH)).*$'
FilterEU:     &FilterEU '^(?=.*(?i)(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU)).*$'
FilterOT:     &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'
FilterAL:     &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# 2.4 策略组代理锚点 - 预定义的代理节点优先级排序,根据自己需求在“4.1 业务策略组”选定策略组代理模板
SelectPY:     &SelectPY {type: select, proxies: [故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动, 直接连接]}
SelectDD:     &SelectDD {type: select, proxies: [直接连接, 默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动]}
SelectDC:     &SelectDC {type: select, proxies: [直接连接, 默认直连, 默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动]}
SelectFB:     &SelectFB {type: select, proxies: [默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动, 默认直连, 直接连接]}
SelectHS:     &SelectHS {type: select, proxies: [狮城轮询, 狮城散列, 狮城粘滞, 狮城自动, 香港轮询, 香港散列, 香港粘滞, 香港自动, 日本轮询, 日本散列, 日本粘滞, 日本自动, 美国轮询, 美国散列, 美国粘滞, 美国自动, 台湾轮询, 台湾散列, 台湾粘滞, 台湾自动, 欧洲轮询, 欧洲散列, 欧洲粘滞, 欧洲自动, 韩国轮询, 韩国散列, 韩国粘滞, 韩国自动, 其他轮询, 其他散列, 其他粘滞, 其他自动]}

# 2.5 共用图标锚点
round:        &round      https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/Round_Robin.png
consistent:   &consistent https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/Round_Robin_1.png
sticky:       &sticky     https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/Pinboard.png
url-test:     &url-test   https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/Auto.png

# 3 核心配置
# 3.1 基础配置
mode: rule                                                                                                   # 工作模式：rule(规则模式)/global(全局模式)/direct(直连模式)
ipv6: true                                                                                                   # 是否启用 IPv6 协议支持
mixed-port: 7893                                                                                             # HTTP+SOCKS5混合代理监听端口号
allow-lan: true                                                                                              # 允许局域网其他设备连接本代理服务
bind-address: "*"                                                                                            # 绑定监听地址，*代表监听本机所有网卡地址
log-level: warning                                                                                           # 日志输出等级，warning仅输出警告及错误日志
unified-delay: true                                                                                          # 统一延迟测速，所有节点使用同一目标地址进行延迟探测，测速结果对比更公平
tcp-concurrent: true                                                                                         # TCP并发测速，并行发起探测请求，缩短节点延迟测试耗时
profile: { store-selected: true, store-fake-ip: true }                                                       # 持久化配置；store-selected保存节点选择，store-fake-ip保存FakeIP域名映射记录

# 3.2 地理数据
geo-auto-update: true                                                                                        # 开启geo地理规则数据库自动更新
geo-update-interval: 24                                                                                      # 地理数据库自动更新间隔，单位小时
geodata-mode: true                                                                                           # 启用geodata模式，使用geoip/geosite规则库进行匹配
geox-url:
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat                    # geosite域名规则库下载地址
  geoip:   https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat                      # geoip IP归属规则库下载地址
  mmdb:    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb                   # metadb新版IP库下载地址
  asn:     https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb              # ASN自治系统编号数据库

# 3.3 认证配置(需要时启用)
#authentication:                                                                                              # 代理接入账号密码认证列表
#  - mihomo:mihomo                                                                                            # 账号:密码，客户端连接代理需要填写该凭据

# 3.4管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip                    # 前端面板Zashboard的远程下载地址
external-controller: 0.0.0.0:9090                                                                            # 外部控制器API监听地址，用于管理面板和远程调用
external-ui-name: zashboard                                                                                  # 指定使用的外部UI面板名称
external-ui: ui                                                                                              # 前端静态网页文件存放的本地目录
secret: 12345678                                                                                             # 控制器API访问密钥，访问管理面板需要携带该密钥鉴权

# 3.5 TUN模式配置
tun:
  enable: true                                                                                               # 开启TUN虚拟网卡，实现系统全局透明代理
  stack: mixed                                                                                               # TUN协议栈，mixed（混合协议栈） / gvisor（用户态协议栈） / mips（轻量内核栈，需V1.19.31以后内核版本） / system（原生网络栈）
  dns-hijack: [udp://any:53, tcp://any:53]                                                                   # DNS劫持，拦截所有网卡53端口UDP/TCP DNS请求，防止DNS泄露
  auto-detect-interface: true                                                                                # 自动识别本机外网出口网卡 (仅内核模式有效)
  auto-route: true                                                                                           # 自动添加系统路由，将流量导入TUN网卡 (仅内核模式有效)
  auto-redirect: true                                                                                        # 自动配置防火墙流量转发规则(Linux iptables/nftables) (仅内核模式有效)
  strict-route: false                                                                                        # 严格路由开关，关闭时部分特殊流量不强制拦截，减少断网风险
  endpoint-independent-nat: true                                                                             # 开启与终端地址无关的NAT，适配流媒体多IP连接场景
  route-exclude-address-set: [cn_IP]                                                                         # 路由排除地址集合，cn_IP国内IP段流量不走TUN代理直接直连

# 3.6 嗅探功能
sniffer:
  enable: true                                                                                               # 开启流量嗅探，从TCP/QUIC流量中提取原始域名用于规则匹配
  override-destination: true                                                                                 # 嗅探成功后改写连接目标地址为嗅探得到的域名
  parse-pure-ip: true                                                                                        # 对直接使用IP访问的流量也尝试嗅探获取域名
  force-dns-mapping: true                                                                                    # 强制使用DNS解析映射信息辅助嗅探域名
  sniff:
    QUIC: { ports: [443] }                                                                                   # QUIC(HTTP3)协议嗅探端口
    TLS:  { ports: [443, 8443] }                                                                             # TLS/HTTPS协议嗅探端口
    HTTP: { ports: [80, 8080-8880] }                                                                         # HTTP明文协议嗅探端口及端口范围
  force-domain:                                                                                              # 强制嗅探域名列表，列表内域名优先进行流量嗅探，多用于流媒体
    - "+.netflix.com"                                                                                        # Netflix域名强制嗅探
    - "+.nflxvideo.net"                                                                                      # Netflix视频资源域名强制嗅探
    - "+.amazonaws.com"                                                                                      # AWS亚马逊云域名强制嗅探
    - "+.media.dssott.com"                                                                                   # 流媒体OTT域名强制嗅探
    - "+.tiktok.com"                                                                                         # TikTok域名强制嗅探
  skip-domain:                                                                                               # 跳过嗅探域名列表，不对以下域名进行流量嗅探，避免设备异常
    - Mijia Cloud                                                                                            # 米家云服务，防止智能家居设备异常
    - dlg.io.mi.com                                                                                          # 小米设备通信域名，跳过嗅探
    - "+.oray.com"                                                                                           # 向日葵域名，跳过嗅探避免远程控制故障
    - "+.sunlogin.net"                                                                                       # 向日葵备用域名，跳过嗅探
    - "+.push.apple.com"                                                                                     # Apple推送服务域名，防止APNs推送失效

# 3.7 本地静态域名映射表(优先级最高,用来强制把某个域名解析到指定 IP,不走 DNS、不经过规则判断)
hosts:
  "epdg.epc.mnc010.mcc234.pub.3gppnetwork.org": [87.194.8.8, 87.194.88.8, 87.194.89.8, 87.194.9.8]           # 静态域名IP绑定
  services.googleapis.cn: services.googleapis.com                                                            # 域名CNAME映射，将该域名指向另一个域名
  dns.alidns.com: [223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1]                                    # 阿里云DNS域名静态IP映射(含IPv4+IPv6)
  doh.pub: [1.12.12.12, 1.12.12.21, 120.53.53.53]                                                            # doh.pub公共DNS静态IP绑定
  dns.google: [8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860::8844]                                      # Google DNS静态IP绑定
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001]                         # Cloudflare DNS静态IP绑定

# 3.8 DNS配置
dns:
  enable: true                                                                                               # 开启mihomo内置DNS服务
  ipv6: true                                                                                                 # DNS解析支持返回IPv6 AAAA记录
  listen: 0.0.0.0:7874                                                                                       # 内置DNS服务监听地址与端口
  enhanced-mode: fake-ip                                                                                     # DNS增强模式使用fake-ip，分配虚拟IP用于规则匹配
  fake-ip-range: 198.18.0.1/16                                                                               # Fake-IP IPv4地址段，fake-ip模式下为域名分配虚拟IPv4地址，生效前提是enhanced-mode: fake-ip开启
  fake-ip-range6: fdfe:dcba:9876::1/64                                                                       # Fake-IP IPv6地址段，为启用fake-ip的域名分配虚拟IPv6地址，仅在enhanced-mode: fake-ip且全局ipv6: true时生效
  fake-ip-filter-mode: blacklist                                                                             # FakeIP过滤器为黑名单模式，列表内域名不使用FakeIP，做真实DNS解析
  respect-rules: false                                                                                       # 关闭DNS遵循流量规则，DNS解析行为不受代理规则约束
  nameserver:                                                                                                # 默认DNS服务器列表
    - 119.29.29.29                                                                                           # 腾讯公共DNS
    - 223.5.5.5                                                                                              # 阿里云公共DNS
    - 180.76.76.76                                                                                           # 百度公共DNS
    - 114.114.114.114                                                                                        # 114公共DNS
  fake-ip-filter:                                                                                            # FakeIP黑名单，列表内域名不分配FakeIP，直接解析真实IP
    - +.lan                                                                                                  # lan局域网域名
    - +.local                                                                                                # local本地局域网域名
    - +.home                                                                                                 # home家庭局域网域名
    - +.internal                                                                                             # internal内网域名
    - 'geosite: cn'                                                                                          # geosite国内域名集合
    - 'geosite: geolocation-cn'                                                                              # geolocation-cn国内站点集合
    - 'rule-set:fakeip-filter'                                                                               # 自定义fakeip-filter规则集
    - +.jsdelivr.net
        
