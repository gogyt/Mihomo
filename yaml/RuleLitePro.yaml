  - RULE-SET,google_IP,默认代理,no-resolve                     # google IP
  - RULE-SET,telegram_IP,默认代理,no-resolve                   # Telegram IP
  - RULE-SET,twitter_IP,默认代理,no-resolve                    # Twitter IP
  - RULE-SET,facebook_IP,默认代理,no-resolve                   # Facebook IP
  - RULE-SET,netflix_IP,默认代理,no-resolve                    # Netflix IP
  - RULE-SET,geolocation-!cn,默认直连                          # 非中国域名(属于gfw的父集,除gfw列表外,大多数境外域名未被墙,给gfw兜底,如果境外域名有连不上的情况,尝试"默认直连"分组切换为任意代理)
