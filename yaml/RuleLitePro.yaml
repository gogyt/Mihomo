# Name: Mihomo Yaml Config - Rule Set Data & Lite Pro Edition
# Link: https://github.com/gogyt/Mihomo/blob/main/yaml/RuleLitePro.yaml

# 功能描述
# ──────────────────────────────────────────────────────────
#  规则来源：       ☑ 内置GEO   ☐ RULE-SET规则集      
# ──────────────────────────────────────────────────────────
#  分流程度：       ☐ 标准分流  ☑ 精简分流  ☐ 重度分流
# ──────────────────────────────────────────────────────────
#  仅内核运行：     ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  广告拦截：       ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  自定义故障转移:  ☑ 支持      ☐ 不支持            
# ──────────────────────────────────────────────────────────
#  多元故障转移：   ☐ 支持      ☑ 不支持            
# ──────────────────────────────────────────────────────────
#  多机场出站类型： ☐ 混合出站   ☑ 自定义出站   ☑ 指定节点出站
# ──────────────────────────────────────────────────────────

# 配置说明：
# 1) 本配置最多采用五层策略,略有套娃,但层次功能分明,可实现长时免维护稳定运行；
# 2) 自定义故障转移，是指故障转移策略组优先“全球手动”的策略组或节点，当“全球手动”节点不可用时自动切换下一策略组节点，策略层级逻辑：故障转移 → 全球手动 → 地区策略 → 均衡or散列or自动or手动 → 该地区某节点,例如：故障转移 → 全球手动 → 日本策略 → 日本自动(所有机场节点) → 某具体的日本节点(所有机场当中ping最低的日本节点),当"全球手动"节点失联时,自动切换至下一策略组“狮城策略”，依此类推；
# 3) 关于"默认直连"策略组,主要挂载了Microsoft、steam等时而需代理的域名，以及geolocation-!cn非中国域名,geolocation-!cn包含了gfw被墙域名,以及其他几乎未被墙的境外域名,含有如cloudflare、cloudfront、fastly等CDN站点,由于先滤掉了gfw被墙域名,剩下的几乎未被墙,可根据使用情况切换代理。
# 4) 需要全防泄漏,使用时将分流策略的"漏网之鱼"、“网络测试”和“默认直连”选择为任意代理节点即可(实际意义并不大)。
# 5) 本配置采用极简分流，仅需将"默认代理"选择好代理策略，以及各地区出站的方式(负载均衡、自动、手动)，当某些网站或链接不能访问时，可尝试将"默认直连"选择为代理节点，如Steam登录器大厅，登陆时需将"默认直连"设置为代理节点，游戏下载不会走代理；
# 6) 本配置可自主选择出站机场,采用多机场分别控制选择出站节点的模式,但需确保机场自定义名称前后一致；比如台湾策略可选Airport1机场的台湾均衡或自动，香港策略可选Airport2机场的香港均衡或自动等等；
# 7) 如果你不熟悉配置，仅将你的机场链接填入“1.6 机场订阅”的url即可使用。如果需个性化配置，配置前仔细阅读配置中的相关说明,根据需要自行调整。
# 8) 如需自定义“1.6 机场订阅”机场名称,需同步修订3.4、3.5、3.6机场名称(注意机场名称前后都有一个空格),要确保1.6与3.4、3.5、3.6中的机场名称保持一致，否则会报错。

# 配置区
# 1 锚点配置 
# 1.1 机场订阅锚点 - 订阅源基础配置 (根据自己机场特性,在filter参数中添加不需要的机场节点关键字,若需保留相关节点,删除该节点名称的关键字)
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}, filter: '^(?!.*(客户端|特殊|如果|导致|一下|教程|测试|剩余|套餐|公告|排除))'}

# 1.2策略组类型锚点 - 定义不同的策略组基础配置
BaseHS: &BaseHS {type: select}
BaseFB: &BaseFB {type: fallback,     empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204'}
BaseCR: &BaseCR {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', strategy: round-robin}         # 轮询：新建立一条 TCP 连接，就依次轮换选取下一个可用节点，循环往复，连接均匀分摊到全部存活节点，不会根据延迟选节点，它只负责流量分发，健康检查仅用于剔除故障节点，不做优先级排序；
BaseCH: &BaseCH {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', strategy: consistent-hashing}  # 一致性哈希（散列）：提取访问目标的顶级域名做哈希计算，哈希值映射到固定节点，同一个域名永远走同一个节点；
BaseSS: &BaseSS {type: load-balance, empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', strategy: sticky-sessions}     # 粘性会话（粘滞）：使用「源 IP + 目标地址」组合作为 key 做哈希缓存，缓存有效期约 10 分钟；在缓存有效期内，同一客户端访问同一目标，固定分配同一个节点；超时后重新哈希分配。
BaseUT: &BaseUT {type: url-test,     empty-fallback: REJECT, interval: 200, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.google.com/generate_204', tolerance: 50}

# 1.3 规则集行为锚点
BehaviorDN:   &BehaviorDN {type: http, behavior: domain,    format: mrs,  interval: 86400}
BehaviorDY:   &BehaviorDY {type: http, behavior: domain,    format: yaml, interval: 86400}
BehaviorIP:   &BehaviorIP {type: http, behavior: ipcidr,    format: mrs,  interval: 86400}
BehaviorCY:   &BehaviorCY {type: http, behavior: classical, format: yaml, interval: 86400}

# 1.4 机场节点筛选正则表达式 - 基于地理位置和关键词过滤
FilterHK:     &FilterHK '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$'
FilterSG:     &FilterSG '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$'
FilterJP:     &FilterJP '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK)).*$'
FilterKR:     &FilterKR '^(?=.*(?i)(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South)).*$'
FilterUS:     &FilterUS '^(?=.*(?i)(美|🇺🇸|US|USA|JFK|SJC|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(Plus|Australia)).*$'
FilterTW:     &FilterTW '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH)).*$'
FilterEU:     &FilterEU '^(?=.*(?i)(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU)).*$'
FilterOT:     &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'
FilterAL:     &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# 1.5 策略组代理锚点 - 预定义的代理节点优先级排序
SelectPY:     &SelectPY {type: select, proxies: [故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动, 直接连接]}
SelectDD:     &SelectDD {type: select, proxies: [直接连接, 默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动]}
SelectDC:     &SelectDC {type: select, proxies: [直接连接, 默认直连, 默认代理, 故障转移, 狮城策略, 美国策略, 香港策略, 日本策略, 台湾策略, 韩国策略, 欧洲策略, 其他策略, 全球手动]}

# 1.6 机场订阅 
# 注意：
#     1) 填入机场订阅链接,可自定义机场名称。末尾的[主][备]为每个节点添加机场名称前缀,可自定义,避免不同的机场节点重名导致出错。
#     2) 本配置默认为2个机场，如果需增加机场，可同步修订3.3-3.6，若不修订，除Airport1、Airport2外的机场节点只能混合出站，无法指定机场出站。
#     3) 如果只有1个机场,建议使用Rulelite.yaml或Geolite.yaml配置文件。或将本配置的3.3-3.6替换为Rule.yaml的3.3-3.7,否则会报错。
proxy-providers: 
  # Airport1订阅源 - 主机场节点集合，注意：修改机场名称Airport1，3.3-3.6机场名称也需保持一致，否则会报错，也可以保持机场默认名称Airport1
  Airport1: {<<: *BaseProvider, url: 'Airport1订阅源地址', override: {additional-prefix: '[主] '}}
  # Airport2订阅源 - 备用机场节点集合，注意：修改机场名称Airport2，3.3-3.6机场名称也需保持一致，否则会报错，也可以保持机场默认名称Airport2
  Airport2: {<<: *BaseProvider, url: 'Airport2订阅源地址', override: {additional-prefix: '[备] '}}
  
# 2 核心配置
# 2.1 基础配置
mode: rule                                                              # 工作模式  rule(规则模式)/ global(全局模式)/ direct(直连模式)
ipv6: true                                                              # 网络协议  是否启用 IPv6 支持
mixed-port: 7893                                                        # 监听端口  HTTP + SOCKS5 混合代理端口
allow-lan: true                                                         # 局域连接  是否允许局域网设备连接
bind-address: "*"                                                       # 监听接口  监听的网络接口(* 表示所有接口)
log-level: warning                                                      # 日志级别  silent(静默)/ error(错误)/ warning(警告)/ info(信息)/ debug(调试)
unified-delay: true                                                     # 统一延迟  减少节点延迟抖动
tcp-concurrent: true                                                    # 并发连接  提升多任务性能
profile: { store-selected: true, store-fake-ip: true }                  # 保存选择  记住选择的节点和策略组、Fake-IP 映射

# 2.2 地理数据
geo-auto-update: true                                                   # 自动更新  geodata
geo-update-interval: 24                                                 # 更新间隔  单位:小时
geodata-mode: true                                                      # 数据分流  使用数据集进行规则与分流匹配
geox-url:
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip:   https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  mmdb:    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  asn:     https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

# 2.3 认证配置
authentication:
  - mihomo:mihomo

# 2.4管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 0.0.0.0:9090                                       # 面板地址
external-ui-name: zashboard                                             # 面板名称
external-ui: ui                                                         # 面板目录
secret: 12345678                                                        # 面板密码

# 2.5 TUN模式配置
tun:
  enable: true                                                          # 网卡模式  是否启用 TUN 虚拟网卡模式  
  stack: mixed                                                          # 协议类型  网络栈:system(系统栈)/ gvisor(内置用户态栈)/ mixed(混合)
  dns-hijack: [udp://any:53, tcp://any:53]                              # 劫持请求  劫持所有 UDP/TCP 53 端口的 DNS 请求
  auto-detect-interface: true                                           # 自动出口  自动识别默认出口网络接口 (仅内核模式有效)
  auto-route: true                                                      # 自动路由  自动添加系统路由表      (仅内核模式有效)
  auto-redirect: true                                                   # 自动定向  自动将流量重定向至 TUN  (仅内核模式有效)
  strict-route: false                                                   # 路由模式  严格路由模式
  endpoint-independent-nat: true                                        # 端点无关  NAT(提高 NAT 类型兼容性,适用于 P2P 和游戏)
  route-exclude-address-set: [cn_IP]                                    # 绕过大陆  匹配大陆IP-CIDR(流量不进入代理) 

# 2.6 嗅探功能
sniffer:
  enable: true                                                          # 启用嗅探  提升分流准确性
  override-destination: true                                            # 成功解析  使用嗅探到的域名覆盖原始目标地址
  parse-pure-ip: true                                                   # 反向解析  解析纯 IP 连接(尝试反向解析获得域名)
  force-dns-mapping: true                                               # 强制映射  DNS 映射(对纯 IP 连接尝试 DNS 映射)
  sniff:
    QUIC: { ports: [443] }                                              # 嗅探参数  QUIC 协议流量(HTTP/3 常用端口)
    TLS:  { ports: [443, 8443] }                                        # 嗅探参数  HTTPS(TLS)常用及备用端口
    HTTP: { ports: [80, 8080-8880] }                                    # 嗅探参数  HTTP 及常见 Web / 代理端口段
  force-domain:
    - "+.netflix.com"                                                   # 强制嗅探  Netflix 主域名
    - "+.nflxvideo.net"                                                 # 强制嗅探  Netflix CDN
    - "+.amazonaws.com"                                                 # 强制嗅探  AWS 云服务
    - "+.media.dssott.com"                                              # 强制嗅探  Disney+ 流媒体
    - "+.tiktok.com"                                                    # 强制嗅探  TikTok 流媒体
  skip-domain:
    - Mijia Cloud                                                       # 跳过嗅探  米家云服务
    - dlg.io.mi.com                                                     # 跳过嗅探  小米设备通信
    - "+.oray.com"                                                      # 跳过嗅探  花生壳服务
    - "+.sunlogin.net"                                                  # 跳过嗅探  向日葵远程控制
    - "+.push.apple.com"                                                # 跳过嗅探  苹果推送服务

# 2.7 本地静态域名映射表(优先级最高,用来强制把某个域名解析到指定 IP,不走 DNS、不经过规则判断)
hosts:
  "epdg.epc.mnc010.mcc234.pub.3gppnetwork.org": [87.194.8.8, 87.194.88.8, 87.194.89.8, 87.194.9.8]
  services.googleapis.cn: services.googleapis.com
  dns.alidns.com: [223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1]
  doh.pub: [1.12.12.12, 1.12.12.21, 120.53.53.53]
  dns.google: [8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844]
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001]   

# 2.8 DNS配置
dns:
  enable: true                                                          # 解析服务  启用 Clash 内置 DNS 服务
  ipv6: true                                                            # 网络协议  启用 IPv6 DNS 解析支持
  listen: 0.0.0.0:7874                                                  # 监听服务  DNS 服务监听地址与端口
  default-nameserver:                                                   # 域名解析  默认域名解析服务器，解析nameserver域名为IP后交给nameserver
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip                                                # 增强模式  FDNS 增强模式(Fake-IP,用于防止 DNS 泄露)
  fake-ip-range: 198.18.0.1/16                                          # 虚拟地址  Fake-IP IPV4虚拟地址池范围
  fake-ip-range6: fdfe:dcba:9876::1/64                                  # 虚拟地址  Fake-IP IPV6虚拟地址池范围
  fake-ip-filter-mode: whitelist                                        # 过滤模式  Fake-IP 白名单模式(规则范围内走Fake-IP，规则范围外的域名直接解析真实IP，不走FakeIP)
  respect-rules: false                                                  # 遵循规则  不强制遵循规则顺序
  nameserver:                                                           # 解析服务  可改为当地运营商提供的 DNS
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:                                                       # Fake-IP
    - 'geosite: gfw'                                                    # Fake-IP规则  被墙规则
    
# 3 代理策略组 
proxy-groups:
  # 3.1 业务策略组
  - {name: 默认代理,        <<: *SelectPY, icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png}
  - {name: 默认直连,        <<: *SelectDD, icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png}

  # 3.2 策略组与地理策略组分界识别
  - {name: 漏网之鱼,        <<: *SelectDC, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png}
  - {name: 网络测试,        <<: *SelectDC, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png}
  - {name: 直接连接,        <<: *BaseHS, proxies: [DIRECT], hidden: true, icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png}

